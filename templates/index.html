<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta
  name="viewport"
  content="width=device-width, initial-scale=1, viewport-fit=cover"
/>
<title>Connect Action</title>

<link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}" />
<script src="https://cdn.socket.io/4.6.1/socket.io.min.js"></script>
<script
  type="module"
  src="{{ url_for('static', filename='main.js', v=main_js_version) }}"
></script>
</head>
<body>
  <div id="start-overlay">
    <h1>ゲーム開始</h1>
    <div class="match-mode" role="group" aria-labelledby="matchModeLabel">
      <span id="matchModeLabel" class="match-mode__label">入室方法</span>
      <div class="match-mode__options">
        <label class="match-mode__option">
          <input
            type="radio"
            name="matchMode"
            value="auto"
            checked
          />
          <span>オートマッチ</span>
        </label>
        <label class="match-mode__option">
          <input type="radio" name="matchMode" value="manual" />
          <span>ルーム選択</span>
        </label>
      </div>
      <p id="matchModeHint" class="match-mode__hint">
        空いているルームに自動で参加します。
      </p>
    </div>
    <label class="form-field" id="roomNameField" hidden>
      <span class="form-field__label">ルーム名</span>
      <input
        type="text"
        id="roomName"
        value="room1"
        inputmode="latin"
        autocomplete="off"
      />
    </label>
    <img
      id="startButton"
      src="/static/assets/start_button.png"
      alt="スタート"
      class="start-button"
    />
    <p class="start-overlay__link"><a href="/editor">設定モードへ</a></p>
  </div>

  <div id="ui" style="display: none">
    <div class="play-layout">
      <aside class="play-layout__sidebar">
        <div id="orders-panel">
          <h3>オーダー</h3>
          <div id="order-list" class="order-list"></div>
        </div>
        <div class="status-panel">
          <div id="timer" class="status-panel__item">タイマー: 60</div>
          <div id="score" class="status-panel__item">スコア: 0</div>
          <div id="inventory" class="status-panel__item">持ち物: なし</div>
        </div>
      </aside>
      <div class="play-layout__stage">
        <div id="game-container" style="display: none"></div>
      </div>
    </div>
    <div
      id="game-over-message"
      class="game-over hidden"
      role="status"
      aria-live="polite"
    ></div>
    <div id="mobile-controls" class="mobile-controls" aria-hidden="true">
      <div class="mobile-controls__hint" aria-hidden="true">
        <p class="mobile-controls__hint-text">
          画面右側を長押しで右移動、<br />画面下部を長押しで下移動
        </p>
      </div>
      <div class="mobile-controls__surface mobile-controls__surface--action">
        <button
          type="button"
          class="mobile-controls__button mobile-controls__button--action"
          data-action="interact"
          aria-label="決定 / アクション"
        >アクション</button>
        <span class="mobile-controls__label">決定</span>
      </div>
    </div>
  </div>

</body>
</html>
