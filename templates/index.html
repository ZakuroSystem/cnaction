<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta
  name="viewport"
  content="width=device-width, initial-scale=1, viewport-fit=cover"
/>
<title>Connect Action</title>

<link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}" />
<script src="https://cdn.socket.io/4.6.1/socket.io.min.js"></script>
<script
  type="module"
  src="{{ url_for('static', filename='main.js', v=main_js_version) }}"
></script>
</head>
<body>
  <div id="start-overlay">
    <h1>ゲーム開始</h1>
    <div class="start-layout">
      <div class="start-layout__controls">
        <div class="match-mode" role="group" aria-labelledby="matchModeLabel">
          <span id="matchModeLabel" class="match-mode__label">入室方法</span>
          <div class="match-mode__options">
            <label class="match-mode__option">
              <input
                type="radio"
                name="matchMode"
                value="auto"
                checked
              />
              <span>オートマッチ</span>
            </label>
            <label class="match-mode__option">
              <input type="radio" name="matchMode" value="manual" />
              <span>ルーム選択</span>
            </label>
          </div>
          <p id="matchModeHint" class="match-mode__hint">
            空いているルームに自動で参加します。
          </p>
        </div>
        <label class="form-field" id="roomNameField" hidden>
          <span class="form-field__label">ルーム名</span>
          <input
            type="text"
            id="roomName"
            inputmode="latin"
            autocomplete="off"
          />
        </label>
        <div id="roomActions" class="room-actions" hidden>
          <button type="button" id="deleteRoomButton" class="room-actions__button room-actions__button--small">
            ルームを削除
          </button>
          <p id="deleteRoomMessage" class="room-actions__message" role="status" aria-live="polite"></p>
        </div>
        <img
          id="startButton"
          src="/static/assets/start_button.png"
          alt="スタート"
          class="start-button"
        />
        <p class="start-overlay__link"><a href="/editor">設定モードへ</a></p>
      </div>
      <section class="game-guide" aria-labelledby="gameGuideTitle">
        <h2 id="gameGuideTitle">ゲームの説明</h2>
        <div class="game-guide__section">
          <h3>操作方法</h3>
          <ul>
            <li>移動: 矢印キー / WASD</li>
            <li>アクション: スペースキー</li>
          </ul>
        </div>
        <div class="game-guide__section">
          <h3>遊び方</h3>
          <ul>
            <li>オーダーに表示された料理を順番に作ります。</li>
            <li>素材を拾って調理し、完成した料理を提出してスコアを稼ぎます。</li>
            <li>制限時間内にできるだけ多くのオーダーをこなしましょう。</li>
          </ul>
        </div>
      </section>
    </div>
  </div>

  <div id="ui" style="display: none">
    <div
      id="match-status"
      class="match-status"
      role="status"
      aria-live="polite"
      hidden
    >
      マッチング中...
    </div>
    <div class="play-layout">
      <aside class="play-layout__sidebar">
        <div id="orders-panel">
          <h3>オーダー</h3>
          <div id="order-list" class="order-list"></div>
        </div>
        <div class="status-panel">
          <div id="timer" class="status-panel__item">タイマー: 60</div>
          <div id="score" class="status-panel__item">スコア: 0</div>
          <div id="inventory" class="status-panel__item">持ち物: なし</div>
          <button type="button" id="deleteRoomInGame" class="room-actions__button room-actions__button--small" hidden>
            ルームを削除
          </button>
          <button type="button" id="leaveGameButton" class="exit-button">
            ゲームを退出
          </button>
        </div>
      </aside>
      <div class="play-layout__stage">
        <div id="game-container" style="display: none"></div>
      </div>
    </div>
    <div
      id="game-over-message"
      class="game-over hidden"
      role="status"
      aria-live="polite"
    ></div>
    <div
      id="action-message"
      class="action-message hidden"
      role="status"
      aria-live="polite"
    ></div>
  </div>

</body>
</html>
