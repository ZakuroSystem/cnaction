[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cnaction"
version = "0.1.0"
description = "Cooperative cooking game server for the CNACTION project"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "CNACTION Team" }]
dependencies = [
    "Flask>=3.0",
    "Flask-SocketIO>=5.3",
    "python-socketio>=5.11",
    "Werkzeug>=3.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["cnaction*"]
