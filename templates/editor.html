<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Stage Editor</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='scripts/lib/jsoneditor.min.css') }}">
    <script src="https://cdn.socket.io/4.6.1/socket.io.min.js"></script>
    <script src="{{ url_for('static', filename='scripts/lib/jsoneditor.min.js') }}"></script>
</head>
<body>
<div class="container mt-4" id="stage-list">
    <h2>ステージ一覧</h2>
    <button id="createStage" class="btn btn-primary mb-2">新規ステージ</button>
    <table id="stageTable" class="table table-striped">
        <thead><tr><th>名前</th><th>更新</th><th>操作</th></tr></thead>
        <tbody></tbody>
    </table>
</div>

<div class="container mt-4 hidden" id="stage-editor">
    <h2 id="editorTitle">ステージ編集</h2>
    <div class="mb-3">
        <label class="form-label">名前: <input type="text" id="stageName" class="form-control"></label>
    </div>
    <fieldset class="mb-3">
        ゲーム時間 <input type="number" id="gameTime" class="form-control d-inline-block w-auto">
        オーダー制限 <input type="number" id="orderTimeLimit" class="form-control d-inline-block w-auto">
        ペナルティ <input type="number" id="wrongPenalty" class="form-control d-inline-block w-auto">
    </fieldset>
    <div class="mb-2">
        <button id="addActionZone" class="btn btn-secondary">アクションゾーン追加</button>
        <button id="addMovingObstacle" class="btn btn-secondary">動く障害物追加</button>
        <button id="addStaticObstacle" class="btn btn-secondary">固定障害物追加</button>
        <button id="addFoodGen" class="btn btn-secondary">食材生成追加</button>
        <button id="addTransfer" class="btn btn-secondary">転送オブジェクト追加</button>
        <button id="deleteObject" class="btn btn-danger">最後に動かしたオブジェクト削除</button>
    </div>
    <canvas id="stageCanvas" width="800" height="600" class="mb-3"></canvas>
    <div class="mb-3">
        <label class="form-label">JSON:</label>
        <div id="configEditor" style="height:400px;"></div>
    </div>
    <button id="saveStage" class="btn btn-primary">保存</button>
    <label class="ms-2">適用先ルーム: <input type="text" id="applyRoom" value="room1" class="form-control d-inline-block w-auto"></label>
    <button id="applyStage" class="btn btn-success ms-2">適用</button>
    <button id="backList" class="btn btn-secondary ms-2">戻る</button>
</div>

<script src="{{ url_for('static', filename='scripts/stage_manager.js') }}"></script>
<script src="{{ url_for('static', filename='scripts/stage_editor.js') }}"></script>
</body>
</html>
